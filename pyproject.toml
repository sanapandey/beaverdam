[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beaverdam"
version = "0.1.0"
description = "Gap-aware private friend recommendation for the 6.1850 BeaverDam project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["beaverdam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
